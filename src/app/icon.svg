<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon : trait encre, mais clair (color-canvas) quand le navigateur est en thème sombre, sinon invisible dans l'onglet. -->
  <style>
    .line { stroke: #1a202c; }
    .dot { fill: #1a202c; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #f8f9fa; }
      .dot { fill: #f8f9fa; }
    }
  </style>
  <g transform="translate(0 2)">
    <!-- Oiseau : tête et dos, puis poitrine, en trait épais encre (token color-ink de globals.css). -->
    <g class="line" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M46 18.5 A11 11 0 0 0 27.7 20.2 C 24 31 18 42 7 48"/>
      <path d="M46 29.5 C 45 41 30 49 7 48"/>
    </g>
    <circle class="dot" cx="39" cy="23" r="2.6"/>
    <!-- Bec : flèche de navigation GPS, couleur accent du site (token color-accent de globals.css). -->
    <path d="M62.5 24 L50.5 18.5 L54.5 24 L50.5 29.5 Z" fill="#ff5a5f" stroke="#ff5a5f" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
